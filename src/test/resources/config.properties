# ============================================================
# config.properties — committed to version control
# Non-sensitive settings only. Override via secrets.properties
# (gitignored) or -D flags from Jenkins/Maven.
# ============================================================

# Browser
BROWSER_HEADLESS=false

# Base URL
BASE_URL=https://platform.aybee.ai/version-53j0m/

# Authentication mode
# USE_NEW_USER=false → sign in with VALID_EMAIL/VALID_PASSWORD from secrets.properties
# USE_NEW_USER=true  → generate a fresh Mailosaur account each run (requires Mailosaur keys)
USE_NEW_USER=false

# Template selection — the template card's element id now equals its NAME. Required (no code
# fallback); chosen by name here / overridable via -DTEMPLATE_NAME. The use-case grouping
# (Marketing & Ads) stays fixed in code; only the template under it is configurable.
TEMPLATE_NAME=Auto-PDP

# Sign-up details used when USE_NEW_USER=true
SIGNUP_COMPANY=Test Company
SIGNUP_FIRSTNAME=Test
SIGNUP_LASTNAME=User

# Shop Setup — Stage 2
ASIN_CODE=B0D523G1BG
VARIANT_PRICE=89.99

# Jam
JAM_UPLOAD_ENABLED=false

# Set to true to leave the browser open after the suite finishes (for manual ID inspection)
KEEP_BROWSER_OPEN=true

# Preview flow — whether the platform shows the new Desktop/Mobile chooser after clicking Preview.
# no  (default) → preview opens directly (old logic), no chooser handling.
# yes            → click Preview, then select Desktop in the chooser; toasts fire after that selection.
NEW_PREVIEW=no

# Default (platform-pre-added) questions. PDP's flow has Default questions but the Template we use has NO default questions — the only questions are
# the Split Tests we add ourselves — so this is 'no'. Kept for consistency with the other suites and
# exposed as FormQuestionsPage.HAS_DEFAULT_QUESTIONS for the participant/preview flow to gate on.
DEFAULT_QUESTIONS=no
