# Browser
BROWSER_HEADLESS=false
CHROME_DRIVER_PATH=/Users/kartik/Documents/bin/chromedriver

# Base URL — version-839wd deployment
BASE_URL=https://platform.aybee.ai/version-839wd/

# Authentication mode
# USE_NEW_USER=false → sign in with VALID_EMAIL / VALID_PASSWORD (existing account)
# USE_NEW_USER=true  → generate a Mailosaur address, sign up, verify OTP, complete onboarding
USE_NEW_USER=false

# Existing user credentials — used when USE_NEW_USER=false
VALID_EMAIL=
VALID_PASSWORD=

# New user sign-up — used when USE_NEW_USER=true
# VALID_PASSWORD is reused as the sign-up password
SIGNUP_COMPANY=Test Company
SIGNUP_FIRSTNAME=Test
SIGNUP_LASTNAME=User

# Mailosaur — required when USE_NEW_USER=true; OTP emails are fetched from here
MAILOSAUR_API_KEY=
MAILOSAUR_SERVER_ID=

# Shop Setup — Stage 2
ASIN_CODE=B0D523G1BG
VARIANT_PRICE=89.99

# Form Questions — Stage 3
ASSET_IMAGE_PATH=/Users/kartik/Documents/pringles.png

# Jam — screen-record each scenario with ffmpeg and, on failure, upload the video via the
# `jam` CLI with a diagnostics comment, attaching the URL to the Allure report.
# Requires ffmpeg and the `jam` CLI on PATH. Set false to disable (all JamManager calls no-op).
JAM_UPLOAD_ENABLED=false

# Set to true to leave the browser open after the test suite finishes (for manual ID inspection)
KEEP_BROWSER_OPEN=true
