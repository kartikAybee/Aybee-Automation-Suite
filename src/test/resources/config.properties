# ============================================================
# config.properties — committed to version control
# Non-sensitive settings only. Override via secrets.properties
# (gitignored) or -D flags from Jenkins/Maven.
# ============================================================

# Browser
BROWSER_HEADLESS=false

# Base URL
BASE_URL=https://platform.aybee.ai/version-13fsx

# Authentication mode
# USE_NEW_USER=false → sign in with VALID_EMAIL/VALID_PASSWORD from secrets.properties
# USE_NEW_USER=true  → generate a fresh Mailosaur account each run (requires Mailosaur keys)
USE_NEW_USER=false

# Template selection — the template card's element id now equals its NAME. Leave EMPTY to use the
# default CTR template inside the "Packaging Optimization" bundle (the bundle is opened first).
# Override it (e.g. -DTEMPLATE_NAME="Some Template") to select that template directly as a top-level
# card, skipping the bundle. The bundle name and the default in-bundle template name are hard-coded
# in NewExperimentPopup; the use-case grouping stays fixed in code.
TEMPLATE_NAME=

# Default (platform pre-added) questions — the backend changes whether these exist, so it's a flag.
# The 2 CTR default questions ARE the whole participant form (CTR adds no manual questions).
# yes → the 2 defaults are pre-added; the guest journey answers them (usual run).
# no  → no default questions; manual index starts at 1; the guest journey answers none.
DEFAULT_QUESTIONS=yes

# Sign-up details used when USE_NEW_USER=true
SIGNUP_COMPANY=Test Company
SIGNUP_FIRSTNAME=Test
SIGNUP_LASTNAME=User

# Shop Setup — Stage 2
ASIN_CODE=B0D523G1BG

# Jam
JAM_UPLOAD_ENABLED=false

# Set to true to leave the browser open after the suite finishes (for manual ID inspection)
KEEP_BROWSER_OPEN=true
