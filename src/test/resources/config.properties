# Browser
BROWSER_HEADLESS=true
CHROME_DRIVER_PATH=/Users/kartik/Documents/bin/chromedriver

# Base URL — all page navigation happens via UI clicks from this entry point
BASE_URL=https://platform.aybee.ai/version-83d2x/

# Mailosaur — email interception for OTP verification
# Email domain is derived automatically as <MAILOSAUR_SERVER_ID>.mailosaur.net
MAILOSAUR_API_KEY=
MAILOSAUR_SERVER_ID=

# Google test account — used for Google OAuth automation (Cases 2, 4, 6 and Google negative tests)
# IMPORTANT: For Cases 1, 3, 5 (manual signup + Google signin blocked),
# the manual account must be created with GOOGLE_TEST_EMAIL so the app can
# match them as the same account. Mailosaur cannot receive OTP for a Gmail address;
# see README for the workaround using Gmail App Password.
GOOGLE_TEST_EMAIL=your_google_test_account@gmail.com
GOOGLE_TEST_PASSWORD=your_google_test_password

# Chrome profile path — set to a Chrome profile where GOOGLE_TEST_EMAIL is already logged in.
# This avoids Google CAPTCHA and account picker delays during test runs.
# Leave blank to use a fresh profile (Google login will be attempted via credentials above).
CHROME_PROFILE_PATH=

# Jam — screen-record each scenario with ffmpeg and, on failure, upload the video via the
# `jam` CLI with a diagnostics comment, attaching the URL to the Allure report.
# Requires ffmpeg and the `jam` CLI on PATH. Set false to disable (all JamManager calls no-op).
JAM_UPLOAD_ENABLED=false

