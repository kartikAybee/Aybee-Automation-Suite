# ============================================================
# config.properties — committed to version control
# Non-sensitive settings only. Override via secrets.properties
# (gitignored) or -D flags from Jenkins/Maven.
# ============================================================

# Browser
BROWSER_HEADLESS=false

# Base URL
BASE_URL=https://platform.aybee.ai/version-13e8y/

# Authentication mode
# USE_NEW_USER=false → sign in with VALID_EMAIL/VALID_PASSWORD from secrets.properties
# USE_NEW_USER=true  → generate a fresh Mailosaur account each run (requires Mailosaur keys)
USE_NEW_USER=false

# Template selection — the template card's element id now equals the template's NAME, so the test
# type is chosen by name here instead of a hard-coded id. Set this to the actual template name as it
# appears in the New Experiment popup (the use-case grouping — Product Development — stays fixed in
# code; only the template under it is configurable). Default is the legacy id for a non-overridden run.
TEMPLATE_NAME=Test Product, Price or Features in your Marketplaces

# Default (platform pre-added) questions — the backend changes whether these exist, so it's a flag.
# yes → platform pre-adds its 3 default questions; manual questions start at index 4; the participant
#       journey expects the default questions (usual run).
# no  → no default questions; manual questions start at index 1; the participant journey expects none.
DEFAULT_QUESTIONS=yes

# Sign-up details used when USE_NEW_USER=true
SIGNUP_COMPANY=Test Company
SIGNUP_FIRSTNAME=Test
SIGNUP_LASTNAME=User

# Shop Setup — Stage 2
ASIN_CODE=B0D523G1BG
VARIANT_PRICE=89.99

# Jam
JAM_UPLOAD_ENABLED=false

# Set to true to leave the browser open after the suite finishes (for manual ID inspection)
KEEP_BROWSER_OPEN=true

# Preview flow — whether the platform shows the new Desktop/Mobile chooser after clicking Preview.
# no  (default) → preview opens directly (old logic), no chooser handling.
# yes            → click Preview, then select Desktop in the chooser; toasts fire after that selection.
NEW_PREVIEW=no
