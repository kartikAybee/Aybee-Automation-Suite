# Browser
BROWSER_HEADLESS=false
CHROME_DRIVER_PATH=/Users/kartik/Documents/bin/chromedriver

# Base URL
BASE_URL=https://platform.aybee.ai/version-839wd/

# Authentication
# USE_NEW_USER=false → sign in with VALID_EMAIL/VALID_PASSWORD (default, no Mailosaur needed)
# USE_NEW_USER=true  → generate a fresh Mailosaur account each run (requires keys below)
USE_NEW_USER=false
VALID_EMAIL=
VALID_PASSWORD=

# Mailosaur — only required when USE_NEW_USER=true
MAILOSAUR_API_KEY=
MAILOSAUR_SERVER_ID=

# Sign-up details used when USE_NEW_USER=true
SIGNUP_COMPANY=Test Company
SIGNUP_FIRSTNAME=Test
SIGNUP_LASTNAME=User

# Asset images uploaded on the QAT project page
ASSET_IMAGE_PATH_A=/Users/kartik/Documents/pringles.png
ASSET_IMAGE_PATH_B=/Users/kartik/Documents/pringles-og.png

# Jam.dev recording — set to true to record screen and upload failed scenarios to Jam.
# Keep false during normal test runs to avoid disk usage and upload overhead.
JAM_UPLOAD_ENABLED=false

# Set to true to leave the browser open after the test suite finishes (for manual ID inspection)
KEEP_BROWSER_OPEN=true
